name: Deploy Cloudflare Worker
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      run_room_probe:
        description: 'After deploy, create one disposable QA room and validate WebSocket'
        required: false
        default: false
        type: boolean

concurrency:
  group: mahjong-friends-cloudflare-production
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check optional Cloudflare credentials
        id: check
        shell: bash
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo 'Cloudflare deployment skipped: configure GitHub Actions secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: '22'
      - name: Upgrade npm
        if: steps.check.outputs.ready == 'true'
        run: npm install -g npm@11
      - name: Install dependencies
        if: steps.check.outputs.ready == 'true'
        run: npm install --no-audit --no-fund
      - name: Deploy React frontend and Durable Object Worker
        if: steps.check.outputs.ready == 'true'
        run: npm run deploy
      - name: Read-only deployed health and frontend smoke
        if: steps.check.outputs.ready == 'true'
        env:
          MAHJONG_PRODUCTION_URL: ${{ vars.MAHJONG_PRODUCTION_URL || 'https://mahjong-friends.xinkaiya13826.workers.dev' }}
        run: npm run smoke:production
      - name: Optional authenticated live room and WebSocket probe
        if: steps.check.outputs.ready == 'true' && github.event_name == 'workflow_dispatch' && inputs.run_room_probe == true
        env:
          MAHJONG_PRODUCTION_URL: ${{ vars.MAHJONG_PRODUCTION_URL || 'https://mahjong-friends.xinkaiya13826.workers.dev' }}
        run: npm run smoke:production -- --room-probe
      - name: Production deployment status
        if: steps.check.outputs.ready == 'true'
        run: echo 'Wrangler deployment and read-only live smoke passed. Authenticated multiplayer/WebSocket remain unverified unless optional room probe also ran.' >> "$GITHUB_STEP_SUMMARY"
