name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Upgrade npm (npm 10 resolver workaround)
        run: npm install --global npm@11
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build Cloudflare bundle
        run: npm run build
      - name: Install Chromium for end-to-end tests
        run: npx playwright install --with-deps chromium
      - name: Four-browser room end-to-end
        run: npm run test:e2e
      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
      - name: Upload v2 viewport screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-viewport-screenshots
          path: test-results/v2-screenshots/
          if-no-files-found: ignore
